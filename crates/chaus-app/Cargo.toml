[package]
name = "chaus-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

description = "Native plaintext editor built on GPUI and Silvestris."

[[bin]]
name = "chaus"
path = "src/main.rs"

[dependencies]
chaus-cli = { workspace = true }
chaus-core = { workspace = true }
chaus-editor = { workspace = true }
chaus-io = { workspace = true }
silvestris = { workspace = true }
gpui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "6b720973027999bae402df23d469026f4cced988", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "6b720973027999bae402df23d469026f4cced988", default-features = false, features = ["wayland", "x11"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
silvestris = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
