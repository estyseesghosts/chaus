[workspace]
resolver = "2"
members = [
    "crates/chaus-core",
    "crates/chaus-layout",
    "crates/chaus-highlight",
    "crates/chaus-io",
    "crates/chaus-cli",
    "crates/chaus-vim",
    "crates/chaus-editor",
    "crates/chaus-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["terezi <jules@foxtails.me>"]

[workspace.dependencies]
chaus-core = { path = "crates/chaus-core" }
chaus-layout = { path = "crates/chaus-layout" }
chaus-highlight = { path = "crates/chaus-highlight" }
chaus-io = { path = "crates/chaus-io" }
chaus-cli = { path = "crates/chaus-cli" }
chaus-vim = { path = "crates/chaus-vim" }
chaus-editor = { path = "crates/chaus-editor" }

# Pinned to a pushed Silvestris revision so a fresh clone builds without a
# sibling checkout. Bump the revision here and in Cargo.lock together.
silvestris = { git = "https://github.com/estyseesghosts/silvestris", rev = "f1c2a010c1c84a90c9ad938eb307f5f2ef5a5ba7", features = ["std-fs"] }

# Pinned to the same Zed commit as Silvestris (config/pins.toml [gpui]).
gpui = { git = "https://github.com/zed-industries/zed", rev = "6b720973027999bae402df23d469026f4cced988", default-features = false }

ropey = "1.6"
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
